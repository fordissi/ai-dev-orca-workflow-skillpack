# Deterministic routing conformance cases.
#
# These cases are executed by scripts/validate-policy-pack.mjs against the real
# policies/MODEL_REGISTRY.yaml. They are a conformance check on
# MODEL_ROUTING_POLICY.md, which stays normative: if a case and the Markdown
# policy disagree, the case is what gets corrected.
#
# kind: selection    -> executed through selectCandidate(); expects a concrete
#                       SELECTED candidate or a BLOCKED result.
# kind: multi_stage  -> a declared multi-slot plan; the validator checks the
#                       declared slots exist, carry the declared role and
#                       minimum_tier, and that gate/concurrency declarations
#                       are well formed. Model choice is left to the overlay at
#                       dispatch time.

version: "0.3"

cases:

  - name: bounded_implementation_all_unknown
    kind: selection
    why: >-
      With no trustworthy reading anywhere, registry order alone decides.
      UNKNOWN must be neither punished nor rewarded.
    slot: DEFAULT_IMPLEMENTER
    resource_states:
      codex: { state: UNKNOWN, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: low }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-luna

  - name: yellow_primary_unknown_fallback
    kind: selection
    why: >-
      A YELLOW primary is not demoted below an UNKNOWN fallback. Registry
      order wins because neither state outranks the other.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex: { state: YELLOW, available: true, source: ORCA_RUNTIME }
      claude: { state: UNKNOWN, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: medium }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra

  - name: unknown_primary_yellow_fallback
    kind: selection
    why: >-
      The mirror of the previous case. An UNKNOWN primary is not demoted below
      a YELLOW fallback either; the result must be identical.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex: { state: UNKNOWN, available: true, source: ORCA_RUNTIME }
      claude: { state: YELLOW, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: medium }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra

  - name: green_fallback_over_red_primary
    kind: selection
    why: >-
      GREEN is preferred over RED, but only among candidates that already meet
      the slot minimum. The overlay reorders; it never lowers the floor.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex: { state: RED, available: true, source: ORCA_RUNTIME }
      claude: { state: GREEN, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: medium }
    expect:
      status: SELECTED
      provider: claude
      model: sonnet

  - name: independent_reviewer_is_disjoint
    kind: selection
    why: >-
      The reviewer must differ from the implementer in BOTH provider and model
      family. Here the implementer is codex/gpt-5.6, so every codex candidate
      is removed and the experimental antigravity candidate is not permitted.
    slot: INDEPENDENT_REVIEWER
    resource_states:
      antigravity: { pools: { gemini: { state: GREEN, available: true, source: ORCA_RUNTIME } } }
      claude: { state: UNKNOWN, available: true, source: ORCA_RUNTIME }
      codex: { state: GREEN, available: true, source: ORCA_RUNTIME }
    options:
      allowExperimental: false
      taskRisk: high
      excludeProvider: codex
      excludeModelFamily: gpt-5.6
    expect:
      status: SELECTED
      provider: claude
      model: sonnet
      disjoint_from:
        provider: codex
        model_family: gpt-5.6

  - name: experimental_high_risk_is_blocked
    kind: selection
    why: >-
      A regression hunt on high-risk work must be disjoint from the
      implementer, which removes every codex candidate. The only remaining
      candidate is experimental, and experimental may not take high-risk work
      unless a human explicitly allows the experiment. Both exclusions are
      policy, so no amount of waiting helps: this is POLICY_BLOCKED, and only a
      human can lift it.
    slot: REGRESSION_HUNTER
    resource_states:
      antigravity: { pools: { gemini: { state: GREEN, available: true, source: ORCA_RUNTIME } } }
      codex: { state: GREEN, available: true, source: ORCA_RUNTIME }
    options:
      allowExperimental: false
      taskRisk: high
      excludeProvider: codex
      excludeModelFamily: gpt-5.6
    expect:
      status: BLOCKED
      code: POLICY_BLOCKED

  - name: no_candidate_meets_minimum
    kind: selection
    why: >-
      No qualified candidate must return BLOCKED rather than crossing the
      capability floor. Both stable Stage 2 candidates (claude/sonnet and
      codex/gpt-5.6-terra) are unavailable and the third is experimental with
      allow_experimental false. Because a candidate would qualify the moment its
      provider returns, the honest code is ROUTING_UNAVAILABLE, not
      POLICY_BLOCKED.
    slot: DEEP_REASONER
    resource_states:
      claude: { state: GREEN, available: false, source: ORCA_RUNTIME }
      codex: { state: GREEN, available: false, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: critical }
    expect:
      status: BLOCKED
      code: ROUTING_UNAVAILABLE

  - name: red_only_is_resource_blocked
    kind: selection
    why: >-
      Every candidate qualifies on capability, but all of them are RED and this
      task does not permit RED routing. That is distinct from having no
      qualified candidate: nothing is misconfigured and no policy forbids these
      models, so the answer is RESOURCE_BLOCKED and the fix is a quota reset or
      an explicit human decision.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex: { state: RED, available: true, source: ORCA_RUNTIME }
      claude: { state: RED, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: medium }
    expect:
      status: BLOCKED
      code: RESOURCE_BLOCKED

  - name: auth_contract_requires_deep_reasoner
    kind: multi_stage
    why: >-
      Auth/RBAC/RLS work carries Stage 2 advanced signals (high ambiguity,
      structural change) so it routes to the Stage 2 DEEP_REASONER slot, and it
      reaches a human gate that quota pressure cannot bypass. Auth/RBAC/RLS is a
      human-gate trigger, not an automatic Stage 3 admission.
    classification:
      risk: critical
      complexity: high
      context_size: medium
      ambiguity: high
      change_intensity: structural
      verification_need: independent
    expect:
      stages:
        - stage: decision
          role: ROUTER
          slot: DEEP_REASONER
          minimum_tier: STRONG
        - stage: review
          role: INDEPENDENT_REVIEWER
          slot: INDEPENDENT_REVIEWER
          minimum_tier: DEFAULT
      concurrency_mode: SEQUENTIAL
      human_gate: true
      human_gate_reason: auth / RBAC / RLS is a non-bypassable gate

  - name: large_cross_repo_with_independent_review
    kind: multi_stage
    why: >-
      Discovery, implementation and review are recorded as separate slots. The
      discovery model must not become the implementation owner by default.
    classification:
      risk: high
      complexity: high
      context_size: large
      ambiguity: medium
      change_intensity: structural
      verification_need: independent
    expect:
      stages:
        - stage: discovery
          role: LONG_CONTEXT_DISCOVERY
          slot: LONG_CONTEXT_DISCOVERY
          minimum_tier: DEFAULT
        - stage: implementation
          role: IMPLEMENTATION
          slot: STRONG_IMPLEMENTER
          minimum_tier: STRONG
        - stage: review
          role: INDEPENDENT_REVIEWER
          slot: INDEPENDENT_REVIEWER
          minimum_tier: DEFAULT
      concurrency_mode: SEQUENTIAL
      human_gate: false

  - name: repair_budget_exhausted
    kind: multi_stage
    why: >-
      The initial implementation attempt is not a repair. Once
      failed_repair_count reaches the slot's max_repair_attempts, the router
      escalates or stops; it never retries indefinitely.
    classification:
      risk: medium
      complexity: high
      context_size: medium
      ambiguity: medium
      change_intensity: structural
      verification_need: standard
    repair:
      slot: STRONG_IMPLEMENTER
      initial_attempt_counts_as_repair: false
      failed_repair_count: 2
    expect:
      stages:
        - stage: escalation
          role: ESCALATION
          slot: ESCALATION_MODEL
          minimum_tier: DEEP
      concurrency_mode: SEQUENTIAL
      human_gate: true
      human_gate_reason: repair budget exhausted without convergence

  - name: untrusted_source_cannot_win
    kind: selection
    why: >-
      The primary declares GREEN while admitting its source is UNKNOWN. That is
      a claim the snapshot cannot back up, so it must not confer eligibility at
      all - not even downgraded to UNKNOWN, which would still let it win on
      registry order. The trustworthy fallback is selected instead.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex: { state: GREEN, available: true, source: UNKNOWN }
      claude: { state: UNKNOWN, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, taskRisk: medium }
    expect:
      status: SELECTED
      provider: claude
      model: sonnet

  - name: untrusted_source_only_is_config_invalid
    kind: selection
    why: >-
      When the only candidate's resource entry violates the source trust
      invariant, the answer is CONFIG_INVALID: the input must be fixed, and no
      other diagnosis can be trusted until it is. Fail closed rather than
      routing on a claim with no backing.
    slot: ESCALATION_MODEL
    resource_states:
      claude: { state: GREEN, available: true, source: UNKNOWN }
      codex: { state: GREEN, available: true, source: UNKNOWN }
    options: { allowExperimental: false, taskRisk: critical }
    expect:
      status: BLOCKED
      code: CONFIG_INVALID

  - name: missing_source_is_config_invalid
    kind: selection
    why: >-
      An entry that declares no source at all is treated the same way. Note the
      contrast with bounded_implementation_all_unknown: having no entry is
      missing data and routes as UNKNOWN, while having an entry that omits its
      source is a malformed claim.
    slot: ESCALATION_MODEL
    resource_states:
      claude: { state: GREEN, available: true }
      codex: { state: GREEN, available: true }
    options: { allowExperimental: false, taskRisk: critical }
    expect:
      status: BLOCKED
      code: CONFIG_INVALID

  - name: explicit_allow_red_selects
    kind: selection
    why: >-
      allow_red is authorised in the Strategic Contract, never decided by the
      Operational Router. With it granted, the same RED-only situation that
      returns RESOURCE_BLOCKED by default proceeds instead.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex: { state: RED, available: true, source: ORCA_RUNTIME }
      claude: { state: RED, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: false, allowRed: true, taskRisk: medium }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra

  - name: explicit_allow_experimental_selects
    kind: selection
    why: >-
      allow_experimental is likewise a Strategic Contract authorisation. Granted
      explicitly, the experimental discovery candidate becomes eligible; the
      default of false is what makes experimental_high_risk_is_blocked block.
    slot: LONG_CONTEXT_DISCOVERY
    resource_states:
      antigravity: { pools: { gemini: { state: GREEN, available: true, source: ORCA_RUNTIME } } }
      claude: { state: UNKNOWN, available: true, source: ORCA_RUNTIME }
    options: { allowExperimental: true, taskRisk: medium }
    expect:
      status: SELECTED
      provider: antigravity
      model: AUTO_GEMINI

  # ------------------------------------------------------------------- #
  # Reset proximity / stranded capacity.
  #
  # The sixth ordering layer. Every case here starts from candidates that
  # already passed eligibility, capability, security and disjointness, so a
  # case can only ever change WHICH equally-qualified candidate wins.
  # `now` is fixed in each case so the derivation is deterministic.
  # ------------------------------------------------------------------- #

  - name: stranded_capacity_promotes_a_near_reset_pool
    kind: selection
    why: >-
      The case this layer exists for. Codex is GREEN with most of a five-hour
      window left and under four hours before it refills; Claude is GREEN with
      plenty left and a day and a half to spend it. Both are already qualified,
      so spending the capacity that is about to vanish costs nothing.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.59, reset_at: "2026-09-01T15:45:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.64, reset_at: "2026-09-03T00:00:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra
      stranded_capacity_risk: HIGH

  - name: stranded_capacity_promotes_over_registry_order
    kind: selection
    why: >-
      The same signal has to be able to move the pick, not merely confirm it.
      Here the registry-preferred Codex has a distant reset and the second
      candidate is the one about to strand capacity, so the promotion is
      recorded rather than silently applied. Both weekly budgets are read and
      healthy, which is what makes spending the burst window safe at all.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.80, reset_at: "2026-09-06T00:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.70, reset_at: "2026-09-01T14:30:00Z" }
        weekly_window: { remaining_ratio: 0.70, reset_at: "2026-09-06T00:00:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: claude
      model: sonnet
      stranded_capacity_risk: HIGH
      stranded_promotion: true

  - name: stranded_capacity_never_admits_an_excluded_candidate
    kind: selection
    why: >-
      The third DEEP_REASONER candidate is experimental and sits on a pool about
      to strand almost all of its capacity. Opportunity cost is a routing
      signal, never an authorisation: an excluded candidate stays excluded
      however much quota is about to expire behind it, so the registry head is
      selected with no promotion.
    slot: DEEP_REASONER
    resource_states:
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.80, reset_at: "2026-09-08T00:00:00Z" }
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.80, reset_at: "2026-09-08T00:00:00Z" }
      antigravity:
        pools:
          gemini:
            state: GREEN
            available: true
            source: ORCA_RUNTIME
            checked_at: "2026-09-01T12:00:00Z"
            short_window: { remaining_ratio: 0.95, reset_at: "2026-09-01T13:00:00Z" }
    options: { allowExperimental: false, taskRisk: critical, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: claude
      model: sonnet
      stranded_promotion: false

  - name: stranded_capacity_never_overrides_disjointness
    kind: selection
    why: >-
      A provider that already implemented the change is still the implementer
      provider, however soon its quota refills. Independent review outranks
      quota economics, so the reviewer stays disjoint even though the
      cheaper-to-use pool is the excluded one.
    slot: STRONG_IMPLEMENTER
    classification:
      risk: high
      complexity: high
      context_size: medium
      ambiguity: medium
      change_intensity: structural
      verification_need: independent
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.90, reset_at: "2026-09-01T13:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.30, reset_at: "2026-09-07T00:00:00Z" }
    options:
      allowExperimental: false
      taskRisk: high
      excludeProvider: codex
      excludeModelFamily: gpt-5.6
      now: "2026-09-01T12:01:00Z"
    expect:
      status: SELECTED
      provider: claude
      model: sonnet
      disjoint_from: { provider: codex, model_family: gpt-5.6 }

  - name: stranded_capacity_never_reorders_yellow_against_unknown
    kind: selection
    why: >-
      A YELLOW pool with capacity about to strand must not jump ahead of an
      UNKNOWN one. YELLOW and UNKNOWN carry no precedence between them, and
      letting an opportunity reading break that tie would punish the pool
      nobody could read.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: UNKNOWN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
      claude:
        state: YELLOW
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.85, reset_at: "2026-09-01T13:00:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra
      stranded_capacity_risk: UNKNOWN

  - name: stranded_capacity_never_promotes_across_bands
    kind: selection
    why: >-
      A YELLOW pool about to reset does not outrank a GREEN one. The
      opportunity layer sits below resource state, so it reorders inside a
      band and never between bands.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: YELLOW
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.95, reset_at: "2026-09-01T13:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.10, reset_at: "2026-09-09T00:00:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: claude
      model: sonnet

  - name: stale_snapshot_yields_no_opportunity_signal
    kind: selection
    why: >-
      A remaining ratio read an hour ago is worse than no ratio, because it
      still looks authoritative. Past the five-minute freshness window the
      opportunity signal goes UNKNOWN and registry order decides again.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.80, reset_at: "2026-09-06T00:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.70, reset_at: "2026-09-01T14:30:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T13:00:00Z" }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra
      stranded_capacity_risk: UNKNOWN

  - name: untrusted_source_confers_no_opportunity_signal
    kind: selection
    why: >-
      The source trust invariant reaches the opportunity layer too. An entry
      that cannot back up its state cannot back up its remaining ratio either,
      so it fails closed rather than winning on an unverifiable urgency claim.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.80, reset_at: "2026-09-06T00:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: UNKNOWN
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.99, reset_at: "2026-09-01T12:30:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra

  # ------------------------------------------------------------------- #
  # Hierarchical quota windows.
  #
  # BURST supplies utilization, BUDGET supplies scarcity, and scarcity wins.
  # Every case here starts from candidates that already passed eligibility,
  # capability, security and disjointness, so a case can only ever change
  # WHICH equally-qualified candidate wins. `now` is fixed throughout.
  # ------------------------------------------------------------------- #

  - name: budget_scarcity_beats_burst_opportunity
    kind: selection
    why: >-
      Codex has four fifths of a five-hour window left with two hours to spend
      it, which in isolation is the strongest possible burst signal. Its weekly
      budget is down to eight percent with five days still to run. Spending the
      burst window would consume a budget that has to last the week, so the
      provider is conserved and the work goes to the healthy candidate.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.80, reset_at: "2026-09-01T14:00:00Z" }
        weekly_window: { remaining_ratio: 0.08, reset_at: "2026-09-06T12:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.75, reset_at: "2026-09-06T12:00:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: claude
      model: sonnet
      conservation_demotion: true
      stranded_promotion: false

  - name: healthy_budget_allows_burst_opportunity
    kind: selection
    why: >-
      The mirror of the previous case, identical but for the weekly reading.
      With three quarters of the budget still available the burst window is
      genuinely free capacity, so Codex keeps the work instead of being
      conserved. The pair is the whole invariant in two cases.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        short_window: { remaining_ratio: 0.80, reset_at: "2026-09-01T14:00:00Z" }
        weekly_window: { remaining_ratio: 0.75, reset_at: "2026-09-06T12:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.75, reset_at: "2026-09-06T12:00:00Z" }
    options: { allowExperimental: false, taskRisk: medium, now: "2026-09-01T12:01:00Z" }
    expect:
      status: SELECTED
      provider: codex
      model: gpt-5.6-terra
      stranded_capacity_risk: HIGH
      conservation_pressure: LOW
      conservation_demotion: false

  - name: imminent_budget_reset_softens_conservation
    kind: selection
    why: >-
      Ten percent of a weekly cap left is scarce with five days to run and
      almost unconstraining an hour before it refills, because the scarcity
      resolves itself inside the horizon of the work being routed. Here the
      head budget refills within the hour, so it is not conserved and keeps
      the work.
    slot: STRONG_IMPLEMENTER
    resource_states:
      codex:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.10, reset_at: "2026-09-01T13:00:00Z" }
      claude:
        state: GREEN
        available: true
        source: ORCA_RUNTIME
        checked_at: "2026-09-01T12:00:00Z"
        weekly_window: { remaining_ratio: 0.75, reset_at: "2026-09-06T12:00:00Z" }
