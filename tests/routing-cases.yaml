  # ---- Reasoning propagation ------------------------------------- #

  - name: codex_dispatch_without_explicit_effort_is_invalid
    kind: reasoning_dispatch
    why: >-
      Registry says Luna max. A codex launch command that omits
      model_reasoning_effort would silently inherit local config, so the
      dispatch itself is invalid before it runs.
    dispatch:
      provider: codex
      expected: { model: gpt-5.6-luna, reasoning_effort: max }
      command: "codex exec -m gpt-5.6-luna -s workspace-write --color never -o out -"
    expect: { result: INVALID_DISPATCH }

  - name: codex_sol_medium_run_as_sol_max_is_a_contract_mismatch
    kind: reasoning_dispatch
    why: The incident from Company Platform. Model id matches, reasoning effort does not.
    dispatch:
      provider: codex
      expected: { model: gpt-5.6-sol, reasoning_effort: medium }
      command: >-
        codex exec -m gpt-5.6-sol -c 'model_reasoning_effort="medium"' -s read-only --color never -o out -
      actual: { model: gpt-5.6-sol, reasoning_effort: max }
    expect: { result: DISPATCH_CONTRACT_MISMATCH }

  - name: codex_terra_high_run_as_terra_high_passes
    kind: reasoning_dispatch
    why: Explicit model and reasoning on the command line, and the runtime agrees.
    dispatch:
      provider: codex
      expected: { model: gpt-5.6-terra, reasoning_effort: high }
      command: >-
        codex exec -m gpt-5.6-terra -c 'model_reasoning_effort="high"' -s workspace-write --color never -o out -
      actual: { model: gpt-5.6-terra, reasoning_effort: high }
    expect: { result: PASS }

  - name: explicit_dispatch_effort_wins_over_local_config
    kind: reasoning_dispatch
    why: >-
      Local config says max, the registry says medium, the command sets medium
      explicitly, and the observed run is medium. The explicit dispatch is what
      counts.
    dispatch:
      provider: codex
      expected: { model: gpt-5.6-sol, reasoning_effort: medium }
      command: >-
        codex exec -m gpt-5.6-sol -c 'model_reasoning_effort="medium"' -s read-only --color never -o out -
      actual: { model: gpt-5.6-sol, reasoning_effort: medium }
    expect: { result: PASS }

  - name: matching_model_id_does_not_excuse_a_reasoning_mismatch
    kind: reasoning_dispatch
    why: A right model at the wrong effort is still the wrong execution identity.
    dispatch:
      provider: codex
      expected: { model: gpt-5.6-luna, reasoning_effort: high }
      command: >-
        codex exec -m gpt-5.6-luna -c 'model_reasoning_effort="high"' -s workspace-write --color never -o out -
      actual: { model: gpt-5.6-luna, reasoning_effort: max }
    expect: { result: DISPATCH_CONTRACT_MISMATCH }
