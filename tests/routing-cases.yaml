  # =================================================================== #
  # THREE-STAGE CAPABILITY ROUTING (0.5)
  #
  # kind: stage_admission    -> admitStage(classification, signals); expects a
  #                             STAGE_1_DEFAULT / STAGE_2_ADVANCED / STAGE_3_FLAGSHIP.
  # kind: reasoning_dispatch -> checkReasoningDispatch(dispatch); expects
  #                             PASS / INVALID_DISPATCH / DISPATCH_CONTRACT_MISMATCH.
  # Risk, production-relatedness and test volume are never stage inputs.
  # =================================================================== #

  # ---- Stage selection ---------------------------------------------- #

  - name: ordinary_bounded_implementation_is_stage_1
    kind: stage_admission
    why: A clear contract with test-backed acceptance is the Stage 1 default.
    classification:
      risk: low
      complexity: low
      context_size: small
      ambiguity: low
      change_intensity: localized
      verification_need: standard
    expect: { stage: STAGE_1_DEFAULT }

  - name: production_but_mechanically_simple_readonly_is_stage_1
    kind: stage_admission
    why: >-
      Production-related and security-sensitive, but mechanically trivial and
      read-only. Strict permissions, review and a human gate belong on it; a
      higher capability stage does not.
    classification:
      risk: high
      complexity: low
      context_size: small
      ambiguity: low
      change_intensity: none
      verification_need: independent
    signals:
      security_involvement: true
    expect: { stage: STAGE_1_DEFAULT }

  - name: high_risk_alone_is_not_stage_3_or_stage_2
    kind: stage_admission
    why: Risk is not capability requirement. Critical risk with nothing hard stays Stage 1.
    classification:
      risk: critical
      complexity: low
      context_size: small
      ambiguity: low
      change_intensity: none
      verification_need: standard
    expect: { stage: STAGE_1_DEFAULT }

  - name: test_volume_is_not_a_stage_input
    kind: stage_admission
    why: >-
      "Many tests" is not a classification dimension and must not raise the
      stage; an ordinary refactor stays Stage 1 regardless of suite size.
    classification:
      risk: medium
      complexity: low
      context_size: medium
      ambiguity: low
      change_intensity: localized
      verification_need: standard
    expect: { stage: STAGE_1_DEFAULT }

  - name: difficult_cross_module_implementation_is_stage_2
    kind: stage_admission
    why: High complexity and structural change intensity are advanced signals.
    classification:
      risk: medium
      complexity: high
      context_size: large
      ambiguity: medium
      change_intensity: structural
      verification_need: standard
    expect: { stage: STAGE_2_ADVANCED }

  - name: architecture_rls_ambiguity_is_stage_2
    kind: stage_admission
    why: >-
      Architecture reasoning plus substantial contract ambiguity is Stage 2.
      Auth/RBAC/RLS is separately a human-gate trigger, not a Stage 3 signal.
    classification:
      risk: high
      complexity: medium
      context_size: medium
      ambiguity: high
      change_intensity: localized
      verification_need: independent
    signals:
      architecture_involvement: true
      security_involvement: true
    expect: { stage: STAGE_2_ADVANCED }

  - name: failed_stage_1_attempt_admits_stage_2
    kind: stage_admission
    why: A failed Stage 1 attempt is itself the advanced signal.
    classification:
      risk: medium
      complexity: medium
      context_size: medium
      ambiguity: medium
      change_intensity: localized
      verification_need: standard
    signals:
      prior_stage_failed: STAGE_1_DEFAULT
    expect: { stage: STAGE_2_ADVANCED }

  - name: failed_stage_2_convergence_admits_stage_3
    kind: stage_admission
    why: Stage 2 failing to converge is exceptional evidence for flagship escalation.
    classification:
      risk: high
      complexity: high
      context_size: large
      ambiguity: high
      change_intensity: structural
      verification_need: adversarial
    signals:
      prior_stage_failed: STAGE_2_ADVANCED
    expect: { stage: STAGE_3_FLAGSHIP }

  - name: irreversible_architecture_with_material_ambiguity_is_stage_3
    kind: stage_admission
    why: A major irreversible architectural decision under material ambiguity.
    classification:
      risk: critical
      complexity: high
      context_size: large
      ambiguity: high
      change_intensity: structural
      verification_need: independent
    signals:
      irreversible: true
      architecture_involvement: true
    expect: { stage: STAGE_3_FLAGSHIP }

  - name: adversarial_security_analysis_is_stage_3
    kind: stage_admission
    why: Security semantics under adversarial verification is flagship reasoning.
    classification:
      risk: critical
      complexity: high
      context_size: medium
      ambiguity: medium
      change_intensity: localized
      verification_need: adversarial
    signals:
      security_involvement: true
    expect: { stage: STAGE_3_FLAGSHIP }

  - name: reviewer_deadlock_admits_stage_3
    kind: stage_admission
    why: Qualified reviewers who cannot resolve a disagreement at Stage 2.
    classification:
      risk: high
      complexity: high
      context_size: medium
      ambiguity: high
      change_intensity: structural
      verification_need: adversarial
    signals:
      reviewer_disagreement_unresolved: true
    expect: { stage: STAGE_3_FLAGSHIP }

