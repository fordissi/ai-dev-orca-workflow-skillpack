# Deterministic Operational Router execution-boundary conformance cases.
#
# These cases are executed by scripts/validate-policy-pack.mjs. They are a
# conformance check on the Operational Router execution boundary section of
# policies/WORKFLOW_POLICY.md, which stays normative: if a case and the
# Markdown policy disagree, the case is what gets corrected.
#
# kind: router_execution     -> executed through classifyRouterExecution();
#                                expects a class/decision/dispatch_slot.
# kind: contract_consistency -> executed through validateRouterExecutionRecord();
#                                expects whether a self-reported record is
#                                internally consistent.
# kind: dispatch_compliance  -> executed through evaluateDispatchCompliance();
#                                verifies Orca-vs-internal dispatch evidence.
#                                Run with the repository registry (support matrix).
# kind: orca_worker_done | orca_completion_wait | orca_delivery |
#       orca_messaging | orca_recovery | orca_task_result
#                             -> scripts/lib/orca-orchestration.mjs protocol
#                                checks (supervised-first, orca 1.4.209).
#
# The incident this section answers: a long-lived Operational Router
# (codex/gpt-5.6-luna/max) spent ~25 minutes doing repository discovery, data
# reconciliation and a 154-test regression suite directly, with no worker
# dispatch and no dispatch identity attestation. Every "worker-shaped"
# case below is drawn from that shape of work.

version: "0.3"

cases:
  - name: orca_worker_cannot_use_internal_subagent
    kind: dispatch_compliance
    why: An internal Antigravity subagent cannot satisfy an Orca specialist contract.
    input:
      task_class: SPECIALIST_REVIEWER
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ANTIGRAVITY_INVOKE_SUBAGENT
    expect:
      result: HARD_FAIL
      reason_code: INTERNAL_SUBAGENT_AS_ORCA_WORKER
      workflow_policy_compliance: NON_COMPLIANT
      orca_dispatch_verified: NO

  - name: explicit_policy_allowed_internal_subagent_passes
    kind: dispatch_compliance
    why: Internal execution is legal only when both selected explicitly and allowed for the class.
    input:
      task_class: BOUNDED_RESEARCH_ASSIST
      dispatch_mode: INTERNAL_SUBAGENT
      execution_mechanism: ANTIGRAVITY_INVOKE_SUBAGENT
      internal_subagent_policy: ALLOWED
    expect:
      result: PASS
      workflow_policy_compliance: COMPLIANT
      orca_dispatch_required: false

  # ---- Supervised-first orchestration (orca 1.4.209) -------------------- #
  # Canonical worker identity is TASK_ID + DISPATCH_ID + launch evidence. A
  # terminal handle is optional: not every worker has a terminal. Launch
  # evidence below is the real receipt of the 2026-09-24 bounded probe.

  - name: supervised_worker_start_with_effective_launch_passes
    kind: dispatch_compliance
    why: >-
      The default path. worker-start created the Task and Dispatch, and
      launch.effective (not launch.requested) proves the exact model and
      effort. No terminal handle is needed.
    input:
      task_class: IMPLEMENTATION_WORKER
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ORCA_WORKER_START
      requested_identity: &requested_luna
        runtime_adapter: codex_cli
        provider_family: openai
        exact_model: gpt-5.6-luna
        effort: low
      evidence: &supervised_luna
        task_id: task_23b0611ccc69
        dispatch_id: ctx_a50dbd1533d4
        launch:
          requested: { agent: codex, model: gpt-5.6-luna, effort: low }
          effective: { agent: codex, model: gpt-5.6-luna, effort: low }
        lifecycle: { model_launched: true, worker_active: true, completed: true }
        completion:
          type: worker_done
          body: probe ok. no files touched. nothing remains.
          payload: '{"taskId":"task_23b0611ccc69","dispatchId":"ctx_a50dbd1533d4","outcome":"succeeded"}'
    expect:
      result: PASS
      dispatch_path: WORKER_START
      supervision: SUPERVISED
      release_semantics: WORKER_RELEASE
      orca_dispatch_verified: YES
      exact_runtime_attestation: MATCH

  - name: missing_dispatch_identity_cannot_verify_orca
    kind: dispatch_compliance
    why: >-
      Replaces the old terminal-handle rule. A terminal handle proves a pane
      exists, not that a Dispatch owns it; without TASK_ID and DISPATCH_ID
      there is no lifecycle authority to verify.
    input:
      task_class: ARCHITECTURE_SPECIALIST
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ORCA_WORKER_START
      requested_identity: *requested_luna
      evidence:
        task_id: task_23b0611ccc69
        terminal_handle: term_cb32a090
        launch:
          effective: { agent: codex, model: gpt-5.6-luna, effort: low }
        lifecycle: { model_launched: true, worker_active: true, completed: true }
    expect:
      result: DISPATCH_BLOCKED
      reason_code: ORCA_DISPATCH_IDENTITY_MISSING
      orca_dispatch_verified: NO

  - name: terminal_create_plus_send_is_a_lightweight_prompt
    kind: dispatch_compliance
    why: >-
      terminal create + terminal send creates no Task, no Dispatch and no
      worker_done authority. It is a LIGHTWEIGHT_TERMINAL_PROMPT and can never
      satisfy ORCA_WORKER_DISPATCH_REQUIRED, however exact its launch argv.
    input:
      task_class: SPECIALIST_REVIEWER
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ORCA_TERMINAL_PROMPT
      requested_identity: *requested_luna
      evidence:
        terminal_handle: terminal-42
        launch_command: codex -m gpt-5.6-luna -c model_reasoning_effort="low"
    expect:
      result: HARD_FAIL
      dispatch_path: LIGHTWEIGHT_TERMINAL_PROMPT
      reason_code: LIGHTWEIGHT_TERMINAL_PROMPT_AS_ORCA_WORKER
      orca_dispatch_verified: NO

  - name: effective_launch_mismatch_fails_exact_dispatch
    kind: dispatch_compliance
    why: >-
      The routing decision asked for Terra high; launch.effective reports Luna
      low. Exact routing applies only when the launched runtime matches.
    input:
      task_class: SECURITY_SPECIALIST
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ORCA_WORKER_START
      requested_identity:
        runtime_adapter: codex_cli
        provider_family: openai
        exact_model: gpt-5.6-terra
        effort: high
      evidence: *supervised_luna
    expect:
      result: HARD_FAIL
      reason_code: EXACT_DISPATCH_FAILURE
      exact_runtime_attestation: MISMATCH
      workflow_policy_compliance: NON_COMPLIANT

  - name: antigravity_exact_model_is_not_expressible_by_worker_start
    kind: dispatch_compliance
    why: >-
      Live probe 2026-09-24: worker-start --agent antigravity refuses --model
      and reports launch.effective.model null. The registry support matrix
      records it, so an exact Antigravity model is steered to custom dispatch
      instead of being silently accepted at the runtime default.
    input:
      task_class: IMPLEMENTATION_WORKER
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ORCA_WORKER_START
      requested_identity:
        runtime_adapter: antigravity
        provider_family: gemini
        exact_model: gemini-3.8-flash-medium
        effort: medium
      evidence:
        task_id: task_a3ee398ff293
        dispatch_id: ctx_668763af5286
        launch:
          requested: { agent: antigravity, model: null, effort: null }
          effective: { agent: antigravity, model: null, effort: null }
    expect:
      result: DISPATCH_BLOCKED
      reason_code: WORKER_START_CANNOT_EXPRESS_EXACT_MODEL
      recommended_path: CUSTOM_DISPATCHED_WORKER

  - name: antigravity_custom_dispatched_worker_passes
    kind: dispatch_compliance
    why: >-
      The exact agy argv in an operator terminal, TUI-ready, then dispatch
      --inject: Task/Dispatch tracked with a worker_done contract. It is
      CUSTOM_DISPATCHED_WORKER, not untracked; only its terminal lifecycle is
      operator-owned.
    input:
      task_class: IMPLEMENTATION_WORKER
      dispatch_mode: ORCA_WORKER
      execution_mechanism: ORCA_CUSTOM_DISPATCH
      requested_identity:
        runtime_adapter: antigravity
        provider_family: gemini
        exact_model: gemini-3.8-flash-medium
        effort: medium
      evidence:
        task_id: task_agy1
        dispatch_id: ctx_agy1
        terminal_handle: term_agy1
        tui_ready: true
        injected: true
        launch_command: agy --model gemini-3.8-flash-medium --effort medium
        runtime_adapter: antigravity
        provider_family: gemini
        exact_model: gemini-3.8-flash-medium
        effort: medium
        lifecycle: { model_launched: true, worker_active: true, completed: true }
        completion:
          type: worker_done
          body: Done. Found nothing. Nothing remains.
          payload: { taskId: task_agy1, dispatchId: ctx_agy1, outcome: succeeded }
    expect:
      result: PASS
      dispatch_path: CUSTOM_DISPATCHED_WORKER
      supervision: TRACKED_CUSTOM
      release_semantics: OPERATOR_OWNED_TERMINAL
      orca_dispatch_verified: YES

  - name: worker_done_validates_against_its_own_dispatch
    kind: orca_worker_done
    why: The real probe worker_done carries both lifecycle ids and an explicit outcome; it settles its own Task.
    message:
      type: worker_done
      body: probe ok. no files touched. nothing remains.
      payload: '{"taskId":"task_23b0611ccc69","dispatchId":"ctx_a50dbd1533d4","outcome":"succeeded"}'
    expected_dispatch: { task_id: task_23b0611ccc69, dispatch_id: ctx_a50dbd1533d4 }
    expect: { valid: true, outcome: succeeded, settles_task: true }

  - name: stale_retry_worker_done_is_rejected
    kind: orca_worker_done
    why: >-
      Both ids are required precisely so a stale retry cannot complete the
      wrong Dispatch.
    message:
      type: worker_done
      body: late report.
      payload: { taskId: task_23b0611ccc69, dispatchId: ctx_a50dbd1533d4, outcome: succeeded }
    expected_dispatch: { task_id: task_23b0611ccc69, dispatch_id: ctx_retry_2 }
    expect: { valid: false, reason_code: STALE_OR_FOREIGN_COMPLETION }

  - name: check_wait_is_the_worker_completion_waiter
    kind: orca_completion_wait
    why: orchestration check --wait blocks natively and wakes on worker_done / escalation / question.
    waiter: { waiter: ORCA_CHECK_WAIT, purpose: WORKER_COMPLETION }
    expect: { compliant: true }

  - name: terminal_wait_is_not_a_worker_completion_waiter
    kind: orca_completion_wait
    why: terminal wait is only for TUI readiness before a low-level inject.
    waiter: { waiter: TERMINAL_WAIT, purpose: WORKER_COMPLETION }
    expect: { compliant: false, reason_code: TERMINAL_WAIT_AS_COMPLETION_WAITER }

  - name: terminal_wait_for_tui_ready_is_allowed
    kind: orca_completion_wait
    why: Custom topology waits for the TUI before dispatch --inject so injected input is not lost.
    waiter: { waiter: TERMINAL_WAIT, purpose: TUI_READY }
    expect: { compliant: true }

  - name: check_wait_timeout_is_a_checkpoint
    kind: orca_delivery
    why: A timeout or empty result is a checkpoint, not a failure.
    delivery: { timed_out: true, consecutive_empty_waits: 1 }
    expect: { action: CHECKPOINT_CONTINUE_WAITING, ack_allowed: false }

  - name: three_empty_waits_enumerate_the_fleet
    kind: orca_delivery
    why: After three consecutive empty waits stop waiting blindly and enumerate worker-list.
    delivery: { timed_out: true, consecutive_empty_waits: 3 }
    expect: { action: ENUMERATE_WORKER_LIST }

  - name: delivery_is_acked_only_after_terminal_ownership_is_decided
    kind: orca_delivery
    why: >-
      The Delivery replays until acked. Every message must be processed and
      every settled terminal given a next owner before the ack.
    delivery:
      messages:
        - id: m1
          type: worker_done
          body: a. b. c.
          payload: { taskId: t1, dispatchId: d1, outcome: succeeded }
      expected_dispatches: [{ task_id: t1, dispatch_id: d1 }]
      processed: [m1]
      terminal_decisions: {}
    expect: { ack_allowed: false, undecided_terminals: [d1] }

  - name: recoverable_blocker_escalates_without_settling
    kind: orca_task_result
    why: >-
      A blocker the coordinator can clear (access, missing input, environment)
      must keep the attempt alive. Settling it as failed would end the Dispatch
      and count a circuit-breaker strike for work that was never impossible.
    task_result: { status: BLOCKED, blocker_kind: RECOVERABLE_BLOCKER }
    expect: { use: escalation, settles: false, outcome: null }

  - name: terminal_blocker_settles_as_failed
    kind: orca_task_result
    why: Only a blocker that makes this dispatch terminally unable to complete settles with worker_done failed.
    task_result: { status: BLOCKED, blocker_kind: TERMINAL_FAIL }
    expect: { use: worker_done, settles: true, outcome: failed }

  - name: unclassified_blocked_is_escalated_not_failed
    kind: orca_task_result
    why: >-
      A bare BLOCKED is escalated for classification rather than failed; a
      wrong escalation costs one coordinator look, a wrong failure costs a
      retry and a circuit-breaker strike.
    task_result: { status: BLOCKED }
    expect: { use: escalation, settles: false }

  - name: human_decision_uses_ask_without_settling
    kind: orca_task_result
    why: A human decision is a blocking question through orchestration ask, not a completion.
    task_result: { status: HUMAN_DECISION_REQUIRED }
    expect: { use: ask, settles: false, outcome: null }

  - name: worker_question_uses_orchestration_ask
    kind: orca_messaging
    why: A local question TUI is invisible to the coordinator; the worker would sit blocked forever.
    event: { actor: WORKER, action: LOCAL_QUESTION_TUI }
    expect: { compliant: false, reason_code: LOCAL_QUESTION_TUI }

  - name: tracked_worker_follow_up_uses_send_to_dispatch
    kind: orca_messaging
    why: terminal send bypasses the durable inbox; follow-ups go to dispatch:<id>.
    event: { actor: COORDINATOR, action: TERMINAL_SEND, tracked_worker: true }
    expect: { compliant: false, reason_code: TERMINAL_SEND_TO_TRACKED_WORKER }

  - name: unverifiable_liveness_authorizes_nothing
    kind: orca_recovery
    why: unverifiable is absence; absence never authorizes stop, abandon, retry or release.
    state: { liveness: unverifiable, liveness_reason: missing_status }
    expect: { action: KEEP_WAITING_OR_INSPECT }

  - name: lost_mutation_response_goes_through_request_show
    kind: orca_recovery
    why: Replaying blind can start a duplicate worker; request-show says whether it already took effect.
    state: { mutation_response_lost: true, request_status: completed }
    expect: { action: READ_RECORDED_RECEIPT }

  - name: git_status_and_handoff_read_is_control_plane
    kind: router_execution
    why: >-
      Required case 1. git status, rev-parse and reading the authoritative
      handoff are exactly the bounded probes the Router exists to perform
      before routing - none of them advance the domain task itself.
    observation:
      intent: CONTROL_PLANE_PROBE
    expect:
      router_execution_class: CONTROL_PLANE
      router_execution_decision: DIRECT_ALLOWED
      dispatch_slot: null

  - name: one_narrow_lookup_for_classification_is_control_plane
    kind: router_execution
    why: >-
      Required case 2. A single, narrowly targeted lookup needed to classify
      the task is the same bounded-probe shape as case 1, just for a
      different routing prerequisite.
    observation:
      intent: CONTROL_PLANE_PROBE
      iteration_count: 1
    expect:
      router_execution_class: CONTROL_PLANE
      router_execution_decision: DIRECT_ALLOWED

  - name: repo_wide_source_archaeology_requires_discovery_dispatch
    kind: router_execution
    why: >-
      Required case 3. Repository-wide source archaeology is broad discovery,
      the exact shape of the observed incident's opening minutes. It maps to
      the existing LONG_CONTEXT_DISCOVERY slot, not a new one.
    observation:
      intent: BROAD_DISCOVERY
    expect:
      router_execution_class: WORKER_DISCOVERY
      router_execution_decision: DISPATCH_REQUIRED
      dispatch_slot: LONG_CONTEXT_DISCOVERY

  - name: code_modification_requires_implementation_dispatch
    kind: router_execution
    why: >-
      Required case 4. Any code edit is worker-shaped regardless of how small
      it looks from inside the Router session.
    observation:
      intent: IMPLEMENTATION
    expect:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: DISPATCH_REQUIRED
      dispatch_slot: IMPLEMENTATION

  - name: broad_regression_suite_requires_regression_hunter_dispatch
    kind: router_execution
    why: >-
      Required case 5. Running a broad test suite as part of solving the task
      - the observed incident's 154-test reconciliation run - is exactly
      what REGRESSION_HUNTER exists for.
    observation:
      intent: REGRESSION_TEST_EXECUTION
    expect:
      router_execution_class: WORKER_REGRESSION
      router_execution_decision: DISPATCH_REQUIRED
      dispatch_slot: REGRESSION_HUNTER

  - name: repeated_iterations_escalate_a_declared_probe
    kind: router_execution
    why: >-
      Required case 6. The Router calls each step a "quick check", but four
      iterations against a stated guardrail of three is the semantic pattern
      this section names explicitly - repeated broad search iterations - and
      the escalation is recorded, not applied silently.
    observation:
      intent: CONTROL_PLANE_PROBE
      iteration_count: 4
    expect:
      router_execution_class: WORKER_DISCOVERY
      router_execution_decision: DISPATCH_REQUIRED
      dispatch_slot: LONG_CONTEXT_DISCOVERY
      guardrail_triggered_includes: [iteration_count]

  - name: sustained_elapsed_time_also_escalates_a_declared_probe
    kind: router_execution
    why: >-
      The other guardrail axis: a probe that has run long past a short
      control-plane window, even without a high iteration count, is the
      "sustained direct workload" pattern - closer to the incident's ~25
      minutes than any single command count would capture.
    observation:
      intent: CONTROL_PLANE_PROBE
      elapsed_ms: 900000
    expect:
      router_execution_decision: DISPATCH_REQUIRED
      guardrail_triggered_includes: [elapsed_ms]

  - name: repo_wide_flag_escalates_even_at_low_iteration_count
    kind: router_execution
    why: >-
      A single command whose own scope is repository-wide is worker-shaped
      immediately - the guardrail does not require several iterations to
      recognise scope that is already broad on the first call.
    observation:
      intent: CONTROL_PLANE_PROBE
      iteration_count: 1
      is_repo_wide: true
    expect:
      router_execution_decision: DISPATCH_REQUIRED
      guardrail_triggered_includes: [is_repo_wide]

  - name: guardrails_never_escalate_work_already_declared_worker_shaped
    kind: router_execution
    why: >-
      Guardrails only escalate a step declared CONTROL_PLANE_PROBE; they are
      not a second classification pass over work the caller already
      correctly labelled worker-shaped.
    observation:
      intent: IMPLEMENTATION
      iteration_count: 1
    expect:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: DISPATCH_REQUIRED
      dispatch_slot: IMPLEMENTATION

  - name: human_explicit_override_permits_direct_execution
    kind: router_execution
    why: >-
      Required case 10. The current human instruction explicitly said "do
      this directly, do not dispatch" - task-local authority the human
      always retains.
    observation:
      intent: IMPLEMENTATION
      current_task_id: "task-42"
      current_instruction_revision: "rev-7"
      human_override: { task_id: "task-42", instruction_revision: "rev-7" }
    expect:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: HUMAN_OVERRIDE
      router_execution_source: HUMAN_EXPLICIT_OVERRIDE

  - name: stale_override_from_a_different_task_does_not_carry_forward
    kind: router_execution
    why: >-
      Required case 11. An override recorded for task-42 must not authorise
      direct execution on task-43 - the same staleness posture as
      HUMAN_OVERRIDE_STALE for model pins, applied to this decision instead.
    observation:
      intent: IMPLEMENTATION
      current_task_id: "task-43"
      current_instruction_revision: "rev-1"
      human_override: { task_id: "task-42", instruction_revision: "rev-7" }
    expect:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: DISPATCH_REQUIRED
      router_execution_source: POLICY_DEFAULT

  - name: stale_override_same_task_different_revision_does_not_carry_forward
    kind: router_execution
    why: >-
      The narrower staleness case: same task id, but the human instruction
      moved on to a new revision without restating the override. A revision
      bump is exactly the kind of change continuation freshness already
      treats as stale elsewhere in this pack; the same posture applies here.
    observation:
      intent: IMPLEMENTATION
      current_task_id: "task-42"
      current_instruction_revision: "rev-8"
      human_override: { task_id: "task-42", instruction_revision: "rev-7" }
    expect:
      router_execution_decision: DISPATCH_REQUIRED
      router_execution_source: POLICY_DEFAULT

  - name: deep_reasoner_role_tag_confers_no_control_plane_exemption
    kind: router_execution
    why: >-
      Required case 12. DEEP_REASONER carries role: ROUTER in the registry
      (it is used for architecture-reasoning dispatch) but it is a dispatched
      worker, not the long-lived control plane. Only the actual ROUTER slot
      is exempt; a caller must say so explicitly via isRouterSlot.
    observation:
      intent: CONTROL_PLANE_PROBE
    options:
      isRouterSlot: false
    expect:
      router_execution_class: null
      router_execution_decision: DISPATCH_REQUIRED

  - name: reviewer_verification_after_worker_returns_is_control_plane
    kind: router_execution
    why: >-
      Required case 13. Confirming a worker's result before closing the cycle
      is bounded verification, one of the direct-allowed categories this
      section names explicitly - it is not re-doing the worker's task.
    observation:
      intent: CONTROL_PLANE_PROBE
    expect:
      router_execution_class: CONTROL_PLANE
      router_execution_decision: DIRECT_ALLOWED

  - name: background_terminal_for_domain_work_is_a_boundary_violation
    kind: router_execution
    why: >-
      Required case 14. A background terminal doing domain implementation
      while the Router stays active is its own violation category,
      independent of how the underlying work would otherwise classify - the
      side channel itself is the problem.
    observation:
      intent: CONTROL_PLANE_PROBE
      background_terminal: true
    expect:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: DISPATCH_REQUIRED
      dispatch_slot: IMPLEMENTATION
      guardrail_triggered_includes: [background_terminal]

  - name: background_terminal_still_yields_to_a_current_human_override
    kind: router_execution
    why: >-
      Even a background-workload violation is not exempt from ordinary human
      authority - a current, correctly bound override still permits it,
      exactly as it would for any other worker-shaped classification.
    observation:
      intent: CONTROL_PLANE_PROBE
      background_terminal: true
      current_task_id: "task-9"
      current_instruction_revision: "rev-1"
      human_override: { task_id: "task-9", instruction_revision: "rev-1" }
    expect:
      router_execution_decision: HUMAN_OVERRIDE
      router_execution_source: HUMAN_EXPLICIT_OVERRIDE

  - name: unrecognised_intent_fails_closed_toward_dispatch
    kind: router_execution
    why: >-
      An intent this classifier does not recognise must not be treated as an
      implicit control-plane probe - that would be the exact silent-continue
      failure mode this section exists to close off.
    observation:
      intent: SOMETHING_UNKNOWN
    expect:
      router_execution_class: null
      router_execution_decision: DISPATCH_REQUIRED

  - name: contract_worker_class_with_direct_allowed_is_inconsistent
    kind: contract_consistency
    why: >-
      A contract self-reporting worker-shaped class with a DIRECT_ALLOWED
      decision and no override is not a legal state - this is the
      CONTRACT_VALIDATED half of enforcement catching a self-contradictory
      record even if classifyRouterExecution was bypassed entirely.
    record:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: DIRECT_ALLOWED
      router_execution_source: POLICY_DEFAULT
    expect:
      valid: false

  - name: contract_control_plane_direct_allowed_is_consistent
    kind: contract_consistency
    why: The ordinary, legal shape for a bounded control-plane probe.
    record:
      router_execution_class: CONTROL_PLANE
      router_execution_decision: DIRECT_ALLOWED
      router_execution_source: POLICY_DEFAULT
    expect:
      valid: true

  - name: contract_worker_class_dispatch_required_needs_a_slot
    kind: contract_consistency
    why: >-
      DISPATCH_REQUIRED without naming which existing slot receives the work
      is not an auditable dispatch decision.
    record:
      router_execution_class: WORKER_DISCOVERY
      router_execution_decision: DISPATCH_REQUIRED
      router_execution_source: POLICY_DEFAULT
    expect:
      valid: false

  - name: contract_human_override_requires_current_binding
    kind: contract_consistency
    why: >-
      A record claiming HUMAN_EXPLICIT_OVERRIDE / HUMAN_OVERRIDE without an
      override actually bound to the current task_id and instruction_revision
      is not legal - the source and decision must be backed by the binding,
      not merely asserted.
    record:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: HUMAN_OVERRIDE
      router_execution_source: HUMAN_EXPLICIT_OVERRIDE
      dispatch_slot: IMPLEMENTATION
      task_id: "task-1"
      instruction_revision: "rev-1"
      human_override: { task_id: "task-0", instruction_revision: "rev-0" }
    expect:
      valid: false

  - name: contract_human_override_with_current_binding_is_consistent
    kind: contract_consistency
    why: The positive control for the previous case.
    record:
      router_execution_class: WORKER_IMPLEMENTATION
      router_execution_decision: HUMAN_OVERRIDE
      router_execution_source: HUMAN_EXPLICIT_OVERRIDE
      dispatch_slot: IMPLEMENTATION
      task_id: "task-1"
      instruction_revision: "rev-1"
      human_override: { task_id: "task-1", instruction_revision: "rev-1" }
    expect:
      valid: true

  - name: contract_control_plane_cannot_claim_dispatch_required
    kind: contract_consistency
    why: >-
      CONTROL_PLANE work does not require dispatch by definition; a record
      claiming both is internally contradictory.
    record:
      router_execution_class: CONTROL_PLANE
      router_execution_decision: DISPATCH_REQUIRED
      router_execution_source: POLICY_DEFAULT
    expect:
      valid: false

  # --- Authorized dispatch is mandatory / confirmation-loop prevention -------
  # Conformance for WORKFLOW_POLICY.md's "Authorized dispatch is mandatory"
  # subsection. The observed failure: after a Strategic Router GO, the
  # Operational Router replied "GO confirmed / ready to proceed" and never
  # dispatched, creating a GO -> "GO received" -> GO confirmation loop.

  - name: authorized_operational_router_with_concrete_scope_must_dispatch
    kind: authorized_dispatch
    why: >-
      CASE 1. Operational Router, a GO with a concrete authorized_scope, no
      blocker and no gate: dispatch is mandatory and an actual dispatch this
      turn is the valid outcome.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: GO, authorized_scope: ["step-1", "step-2", "step-3"] }
      next_step_in_scope: true
      response_kind: DISPATCH
    expect:
      operational_state: AUTHORIZED
      required_action: DISPATCH
      ack_only_valid: false
      verdict: VALID

  - name: authorized_router_status_only_ack_is_an_invalid_completion
    kind: authorized_dispatch
    why: >-
      CASE 2. The confirmation loop itself: a valid authorization, enough
      information to dispatch, and the router replies only "GO confirmed;
      ready to proceed" with no dispatch attempt. That is not a valid turn.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: GO, authorized_scope: ["step-1", "step-2"] }
      next_step_in_scope: true
      dispatch_attempted: false
      response_kind: STATUS_ONLY_ACK
    expect:
      operational_state: AUTHORIZED
      required_action: DISPATCH
      ack_only_valid: false
      verdict: INVALID

  - name: new_state_contradiction_after_authorization_is_a_valid_gate
    kind: authorized_dispatch
    why: >-
      CASE 3. GO exists, but the runtime state materially contradicts the task
      contract (expected RECORDED_UNCLAIMED, actual CLAIMED_BY_OTHER_SESSION).
      Stopping and naming that concrete gate is correct.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: GO, authorized_scope: ["claim-record", "preflight"] }
      new_material_condition: CLAIMED_BY_OTHER_SESSION
      response_kind: HUMAN_GATE
    expect:
      operational_state: HUMAN_GATE
      required_action: STOP_AT_GATE
      verdict: VALID

  - name: dispatching_past_a_new_gate_is_invalid
    kind: authorized_dispatch
    why: >-
      CASE 3 (negative). The same new material contradiction, but the router
      dispatches anyway instead of stopping. Existing authorization is not
      unlimited execution.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: GO, authorized_scope: ["claim-record"] }
      new_material_condition: CLAIMED_BY_OTHER_SESSION
      response_kind: DISPATCH
    expect:
      operational_state: HUMAN_GATE
      required_action: STOP_AT_GATE
      verdict: INVALID

  - name: step_outside_authorized_scope_must_stop_at_the_boundary
    kind: authorized_dispatch
    why: >-
      CASE 4. Authorized for Steps 1-7; Step 8 is production execution, a
      forbidden action. Steps 1-7 may proceed; the router must STOP before
      Step 8 and hand off, not dispatch it.
    observation:
      role: OPERATIONAL_ROUTER
      authorization:
        decision: GO
        authorized_scope: ["step-1", "step-2", "step-3", "step-4", "step-5", "step-6", "step-7"]
        forbidden_actions: ["production execution"]
        stop_conditions: ["final EXTERNAL_HANDOFF"]
      next_step_forbidden: true
      response_kind: DISPATCH
    expect:
      operational_state: AUTHORIZED
      required_action: STOP_AT_SCOPE_BOUNDARY
      verdict: INVALID

  - name: handing_off_at_the_scope_boundary_is_valid
    kind: authorized_dispatch
    why: >-
      CASE 4 (positive). At the same boundary, returning EXTERNAL_HANDOFF
      instead of dispatching the forbidden step is the correct completion.
    observation:
      role: OPERATIONAL_ROUTER
      authorization:
        decision: GO
        authorized_scope: ["step-1", "step-2", "step-3", "step-4", "step-5", "step-6", "step-7"]
        forbidden_actions: ["production execution"]
      next_step_forbidden: true
      response_kind: HANDOFF
    expect:
      required_action: STOP_AT_SCOPE_BOUNDARY
      verdict: VALID

  - name: no_authorization_means_plan_only_never_dispatch
    kind: authorized_dispatch
    why: >-
      CASE 5. The Operational Router has an executable task but no GO / no
      execution authorization. It may produce a routing plan; it must not
      dispatch.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: NO_GO, authorized_scope: [] }
      response_kind: DISPATCH
    expect:
      operational_state: PLANNING_ONLY
      required_action: PRODUCE_PLAN_ONLY
      ack_only_valid: true
      verdict: INVALID

  - name: planning_only_may_return_a_routing_plan
    kind: authorized_dispatch
    why: >-
      CASE 5 (positive). With no authorization, returning the routing plan /
      decision is the valid outcome.
    observation:
      role: OPERATIONAL_ROUTER
      authorized: false
      response_kind: PLAN
    expect:
      operational_state: PLANNING_ONLY
      required_action: PRODUCE_PLAN_ONLY
      verdict: VALID

  - name: strategic_router_on_go_hands_off_and_must_not_dispatch
    kind: authorized_dispatch
    why: >-
      CASE 6. Strategic Router with a GO decision: handoff only. It must not
      perform Orca / local operational dispatch merely because decision == GO.
    observation:
      role: STRATEGIC_ROUTER
      authorization: { decision: GO, authorized_scope: ["step-1"] }
      response_kind: HANDOFF
    expect:
      required_action: HANDOFF_ONLY
      verdict: VALID

  - name: strategic_router_performing_dispatch_is_invalid
    kind: authorized_dispatch
    why: >-
      CASE 6 (negative). The role boundary: a Strategic Router that dispatches
      operational work has crossed into execution.
    observation:
      role: STRATEGIC_ROUTER
      authorization: { decision: GO, authorized_scope: ["step-1"] }
      response_kind: DISPATCH
    expect:
      required_action: HANDOFF_ONLY
      verdict: INVALID

  - name: authorized_continuation_needs_no_new_go_between_phases
    kind: authorized_dispatch
    why: >-
      CASE 7. authorized_scope is implementation -> test -> review.
      Implementation completed successfully and no new material condition
      exists, so the router continues to the test phase without another human
      GO.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: GO, authorized_scope: ["implementation", "test", "review"] }
      next_step_in_scope: true
      response_kind: DISPATCH
    expect:
      operational_state: AUTHORIZED
      required_action: DISPATCH
      verdict: VALID

  - name: attempted_dispatch_that_the_runtime_fails_is_a_valid_blocked
    kind: authorized_dispatch
    why: >-
      CASE 8. "Dispatch is mandatory" means the attempt is mandatory, not that
      it must succeed. The router is authorized, attempts the existing dispatch
      path, the runtime returns a concrete failure, and it reports BLOCKED with
      evidence. Valid, because dispatch was attempted.
    observation:
      role: OPERATIONAL_ROUTER
      authorization: { decision: GO, authorized_scope: ["step-1"] }
      next_step_in_scope: true
      dispatch_attempted: true
      dispatch_outcome: RUNTIME_FAILURE
      response_kind: BLOCKED
    expect:
      operational_state: AUTHORIZED
      required_action: DISPATCH
      verdict: VALID

  - name: external_async_wait_is_neither_control_plane_nor_worker
    kind: router_execution
    why: >-
      Incident LLM_BUSY_POLLING_AND_STALE_CHECK_RUN_TARGET. Waiting on a
      Cloudflare/GitHub deployment is not a bounded control-plane probe and not
      worker-shaped work: it is handed to a deterministic waiter. The Router
      does not stay in the loop between polls.
    observation:
      intent: EXTERNAL_ASYNC_WAIT
      terminal_signal: null
      wait_capabilities: { native_watch: true }
    expect:
      router_execution_class: EXTERNAL_WAIT
      router_execution_decision: DETERMINISTIC_WAIT_REQUIRED
      dispatch_slot: null

  - name: external_async_wait_re_enters_the_router_on_a_terminal_signal
    kind: router_execution
    why: >-
      SUCCESS / FAILURE / TIMEOUT / ACTION_REQUIRED are the only re-entries.
      On one of them the Router legitimately runs again - that turn is
      control-plane work it may do directly.
    observation:
      intent: EXTERNAL_ASYNC_WAIT
      terminal_signal: FAILURE
      wait_capabilities: { native_watch: true }
    expect:
      router_execution_class: EXTERNAL_WAIT
      router_execution_decision: DIRECT_ALLOWED
      dispatch_slot: null

  - name: a_human_override_does_not_license_busy_polling
    kind: router_execution
    why: >-
      A current human override can authorise direct Router execution of
      worker-shaped work. It cannot turn unchanged external status into model
      work: there is nothing to authorise, the waiting simply is not the model
      job.
    observation:
      intent: EXTERNAL_ASYNC_WAIT
      terminal_signal: null
      wait_capabilities: { background_wait: true }
      current_task_id: deploy-watch
      current_instruction_revision: rev-1
      human_override: { task_id: deploy-watch, instruction_revision: rev-1 }
    expect:
      router_execution_class: EXTERNAL_WAIT
      router_execution_decision: DETERMINISTIC_WAIT_REQUIRED
