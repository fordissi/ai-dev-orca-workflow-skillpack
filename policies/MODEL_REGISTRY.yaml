# Model Registry — USER-AUTHORITATIVE model configuration.
#
# HARD INVARIANT
# --------------
# Registry membership and `enabled` status are human-authoritative
# configuration, not an AI-generated capability verdict.
#
# This file expresses the operator's decision: "these are the provider/model
# candidates I allow this workflow to use, and the stage / role / reasoning I
# want them used under." An AI operating this pack MUST NOT cancel a candidate
# because of its own benchmark opinion, its own read of `evidence_status`,
# whether 3-5 smoke cases were run, or a preference for a different model.
#
# If the human put a model here and set `enabled: true` (or omitted `enabled`),
# it is ROUTING ELIGIBLE. The AI may refuse it only on genuine execution
# impossibility (provider CLI absent, model id unresolvable, reasoning control
# unsupported, auth invalid, permission ceiling incompatible, runtime cannot
# start, reviewer disjointness cannot be met) -> a real CONFIG_INVALID /
# ROUTING_UNAVAILABLE / PERMISSION_BLOCKED outcome.
#
# Among enabled candidates that pass hard execution eligibility, the AI's job
# is to pick the best fit by stage / role / disjointness / permission and then
# by quota / resource state. It does not re-rank models by quality.
#
# ADOPTERS READ THIS FIRST
# ------------------------
# The mapping shipped here reflects the AUTHORING HOST and the CLI state
# observed there at the recorded verification date. It is NOT a guarantee that
# these providers, models or plans are available to you. Before your first
# dispatch, re-resolve every candidate against your OWN installed CLIs and
# subscription plans, and edit this file to match what YOU have enabled. This
# is still user-authoritative configuration - just yours, not the author's.
#
# --------------------------------------------------------------------------
# FIELD SEMANTICS
#
#   enabled: true|false   HUMAN-authoritative. false = do not route here.
#                         Missing -> treated as true (backward compatible).
#   status: stable|experimental
#                         INFORMATIONAL evidence metadata ONLY. As of 0.6 it
#                         does NOT gate execution eligibility. `experimental`
#                         MUST NOT block a model the user has enabled.
#   evidence_status, confidence, evidence_scope, source, verified_at
#                         INFORMATIONAL. Help the human decide future registry
#                         changes. Never an AI routing gate.
#   stage, reasoning, capability_tier, model_family, candidate order
#                         HUMAN-authoritative configuration.
#
# `allow_experimental` in a contract is retained for backward compatibility and
# has NO routing effect on an enabled registry candidate (see
# MODEL_ROUTING_POLICY.md). Reasoning-exact dispatch, reviewer disjointness,
# the three-stage architecture, the flagship guard and the hierarchical quota
# windows are UNCHANGED.
#
# Stable workflow rules live in the Markdown policies and do NOT change when a
# model changes. Only this file changes when mapping changes.
#
# --------------------------------------------------------------------------
# 0.10 (2026-10-19) GEMINI 4 ARGON AS A THIRD STAGE 3 FLAGSHIP
#
# Human decision: add `antigravity / gemini-4-argon` to ESCALATION_MODEL as
# the THIRD candidate, after Sol and Opus, at reasoning `medium` (never max;
# the catalog offers low|medium|high). Argon has its OWN quota on the Google AI
# Pro plan - a weekly-only bucket with no 5-hour window, separate from the
# Gemini Flash/Pro bucket - so it gets its own resource_state_key
# `antigravity.argon` via runtime_adapters.antigravity.model_resource_pools.
# It is deliberately kept out of every busy slot: the quota size is
# unpublished and an exhausted weekly-only bucket stays empty until reset.
# Live `agy models` 2026-10-19 lists gemini-4-argon-{low,medium,high};
# `agy /usage` 2026-10-19 shows a "Gemini 4 Argon Weekly Limit" bucket.
# See policies/registry-decisions/2026-10-19-gemini-4-argon.md.
#
# 0.9 (2026-10-12) GPT-6.1 SOL REPLACES GPT-6 SOL
#
# Human decision: every `codex / gpt-6-sol` candidate becomes
# `codex / gpt-6.1-sol` with the SAME stage, tier and reasoning (Stage 2
# positions stay `low`, ESCALATION_MODEL stays `medium`). model_family stays
# `gpt-6`, so reviewer disjointness is unchanged. Never dispatch Codex
# `ultra` effort (it delegates to its own subagents, outside Orca
# supervision). gpt-6.1-sol is listed in the codex-cli 0.162.1 model cache;
# Live-probed 2026-10-12 12:37 (codex-cli 0.162.1): `codex exec -m gpt-6.1-sol`
# at low and at medium both reported model gpt-6.1-sol with the requested
# effort and replied OK.
# See policies/registry-decisions/2026-10-12-gpt-6-1-sol.md.
#
# 0.8 (2026-10-12) HAIKU 5.5 AS STAGE 1 QUOTA RELIEF
#
# Human decision: `claude / haiku / medium` (Haiku 5.5, live-probed Claude
# Code 2.1.296) is added as a Stage 1 / DEFAULT candidate in
# CHEAP_GENERALIST, DEFAULT_IMPLEMENTER, LONG_CONTEXT_DISCOVERY,
# INDEPENDENT_REVIEWER and REGRESSION_HUNTER, always AFTER Gemini, so it
# takes Stage 1 work when Codex (and Gemini) are short. Not in ROUTER,
# Stage 2 or Stage 3. Effort is medium, not max (Haiku max burns many more
# tokens). It shares the `claude` pool with Sonnet / Opus.
# See policies/registry-decisions/2026-10-12-claude-haiku-5-5.md.
#
# 0.7 (2026-10-03) MODEL GENERATION UPDATE
#
# Codex: gpt-5.6-luna -> gpt-6-luna, gpt-5.6-sol -> gpt-6-sol (model_family
# gpt-6). Terra is REMOVED by human decision; every former Terra slot
# (STRONG_IMPLEMENTER, DEEP_REASONER, INDEPENDENT_REVIEWER) now uses
# gpt-6-sol at Stage 2 / STRONG with reasoning LOW (human decision: Sol
# needs less effort than Terra did; Terra ran at high). Sol in
# ESCALATION_MODEL is unchanged in role (Stage 3, DEEP, medium).
# Luna: every Luna candidate runs at reasoning max (human decision: Luna is
# cheap), and Luna max is the HEAD of STRONG_IMPLEMENTER (Stage 2).
# Claude: aliases unchanged; `sonnet` now resolves to Sonnet 5.5 and `opus`
# to Opus 5.5. Live-probed 2026-10-03 (codex-cli 0.156.1, Claude Code
# 2.1.288). See policies/registry-decisions/2026-10-03-gpt-6-and-claude-5-5.md.
#
# 0.6 (2026-09-02) REGISTRY AUTHORITY CORRECTION
#
# Registry authority changed from evidence-gated AI eligibility to
# human-authoritative configuration. Every candidate now carries
# `enabled: true`. The antigravity / AUTO_GEMINI entries are ENABLED and
# routable for autonomous quota routing despite `status: experimental` /
# incomplete qualification (E6): that is informational, not a gate. Terra is
# enabled despite zero local smoke cases. See
# policies/registry-decisions/2026-09-02-user-authoritative-registry.md.
#
# Prior: 0.5 three-stage routing
# (policies/registry-decisions/2026-09-02-three-stage-routing.md);
# 0.4 implementer-tier rebalance
# (policies/registry-decisions/2026-09-02-rebalance-implementer-tiers.md).
# --------------------------------------------------------------------------

version: "0.10"
verified_at: "2026-10-19"

capability_tier_order: [CHEAP, DEFAULT, STRONG, DEEP]

# Capability stage: a backward-compatible band above capability_tier.
# Each tier belongs to exactly one stage (a partition).
stages:
  STAGE_1_DEFAULT:
    tiers: [CHEAP, DEFAULT]
    admission: default
    admission_note: >-
      The default for the majority of tasks. Used unless there is concrete
      evidence Stage 1 is insufficient. Risk, production-relatedness, security
      sensitivity and test volume do NOT by themselves raise the stage.
  STAGE_2_ADVANCED:
    tiers: [STRONG]
    admission: advanced_signal
    admission_note: >-
      Requires at least one advanced signal: high complexity, high ambiguity,
      structural change intensity, architecture reasoning, security/RLS
      semantic reasoning, high semantic coupling, adversarial verification, or
      a failed Stage 1 attempt. Risk alone is insufficient. This is the normal
      escalation tier.
  STAGE_3_FLAGSHIP:
    tiers: [DEEP]
    admission: exceptional_evidence
    admission_note: >-
      Rare. Requires exceptional evidence: Stage 2 failed to converge,
      unresolved disagreement between qualified reviewers, a major irreversible
      architectural decision with material ambiguity, adversarial security
      analysis, exceptional multi-stage agentic execution, an exceptional
      production incident, or explicit human authorization. Sol and Opus are
      flagship escalation resources, not routine workers.

# Dynamic display names must be resolved at use time, never frozen from one
# machine. See references/OFFICIAL_COMMANDS.md for the verified invocation.
resolvers:
  antigravity_models:
    command: "agy models"
    resolves: ["AUTO_GEMINI"]
    verified_at: "2026-09-03"
    note: >-
      AUTO_GEMINI is a placeholder. Resolve it against the live model list
      before dispatch. Do not hard-code a display name observed on one host.
      Verified 2026-09-02: the command returns a live list that also contains
      NON-Gemini families, so provider does not imply model_family. A
      resolution outside the candidate's declared model_family is
      CONFIG_INVALID and must not be dispatched - this is what keeps
      independent-review disjointness honest.
      Effort is encoded in the id: `reasoning: low` resolves to the live
      list's newest Gemini Flash family entry ending `-low`, `reasoning: high`
      to the newest ending `-high`. `agy --effort low|medium|high` is the
      session-level equivalent. Resolve against the live list at dispatch
      time; this is a hint, not a frozen string.
      Re-verified 2026-09-03 against `agy 1.1.24`: the list now carries
      multiple Gemini Flash generations at once (observed: 3.8, 3.7, 3.6,
      3.1-pro, newest first). Before 2026-09-03 only one generation was ever
      live, so "the family entry matching this effort" was unambiguous; it no
      longer is. The resolver MUST take the newest generation matching the
      requested effort (the live list's own ordering, newest-first, is
      sufficient - do not add separate version-comparison logic), never an
      older one, and must not degrade to UNKNOWN merely because the list grew
      longer. `gemini-3.8-flash-low` and `-high` were dispatched directly
      (`agy -p "<prompt>" --model gemini-3.8-flash-<effort>`) and both
      self-reported `Gemini 3.8 Flash` / `Google Gemini` correctly - the
      resolver path itself needs no candidate edit for this generation change.
      Model eligibility is evaluated PER EXECUTION TASK: the headless
      permission limitation recorded in E6 constrains specific task shapes,
      it is not global ineligibility.
  claude_models:
    command: "claude --model <alias>"
    verified_at: "2026-10-12"
    # CLI catalog aliases. The `model:` value of every claude candidate MUST
    # be one of these keys (or a reviewed `model_overrides` key). The value is
    # the exact `--model` argument dispatched. Routing intent is informational
    # guidance for the human editing slots; it does not add slot candidates.
    catalog_aliases:
      sonnet: { cli_model: sonnet, display: "Sonnet 5.5", routing_intent: routine_default }
      opus: { cli_model: opus, display: "Opus 5.5", routing_intent: complex_high_quality }
      haiku: { cli_model: haiku, display: "Haiku 5.5", routing_intent: quick_cheap }
    # Reviewed explicit mappings (behavesAs / modelOverrides equivalent) for
    # any non-catalog id. Empty by design: a key here is a human decision,
    # never something an AI derives from a display name.
    model_overrides: {}
    note: >-
      Re-verified 2026-10-03 (Claude Code 2.1.288): `claude -p --model sonnet`
      reported claude-sonnet-5-5 and `--model opus` reported claude-opus-5-5
      in modelUsage. Re-verified 2026-10-12 (Claude Code 2.1.296):
      `--model haiku` reported claude-haiku-5-5 (contextWindow 1000000,
      maxOutputTokens 128000). Sonnet -> Sonnet 5.5, Opus -> Opus 5.5,
      Haiku -> Haiku 5.5. quick_cheap guidance for Haiku 5.5: short,
      bounded, high-volume work (read/summarize subagents, classification,
      grep-and-report, browser/computer-use steps); keep per-request input
      under 100k tokens (API price is 5x above 100k); do not use it for
      long autonomous coding loops (Terminal-Bench 4.0: 39.2% vs Sonnet
      5.5 70.6%). Registry 0.8 places Haiku as a Stage 1 candidate after
      Gemini in five slots (not ROUTER, not Stage 2/3). See
      policies/registry-decisions/2026-10-12-claude-haiku-5-5.md.
      A versioned id built from a display name (e.g.
      `sonnet-5`) is NOT in this CLI's catalog
      and fails with "isn't described by this version's model catalog". That
      is MODEL_UNKNOWN for that one model - never PROVIDER_UNAVAILABLE for
      Claude. Do not invent versioned model ids from display names.

# Runtime adapters. A dispatch target is
#   runtime_adapter + provider_family + exact model + effort
# never a provider name alone. A candidate's `provider:` field names the
# runtime path it is dispatched through (its `registry_provider` below) and
# its `model_family` names the provider family. One family may have several
# runtime paths (Claude: claude_cli AND antigravity); one runtime may serve
# several families (antigravity: gemini, claude, gpt-oss). A failure on one
# runtime path never implies an outage of the family on another path.
runtime_adapters:
  codex_cli:
    registry_provider: codex
    command: codex
    provider_families: [openai]
    model_resolution: pass_through
    # Effort values are owned by OFFICIAL_COMMANDS.md / checkReasoningDispatch.
    efforts: null
    resource_pools: { openai: codex }
    # Orca supervised-worker support (orca 1.4.209, live-probed 2026-09-24):
    # `worker-start --agent codex --model gpt-5.6-luna --effort low` returned
    # launch.requested == launch.effective == {codex, gpt-5.6-luna, low}.
    # gpt-6-luna / gpt-6-sol were live-probed 2026-10-03 via `codex exec -m`
    # (codex-cli 0.156.1); not yet re-probed through worker-start.
    # gpt-6.1-sol (registry 0.9) was live-probed 2026-10-12 via `codex exec -m`
    # at low and medium (codex-cli 0.162.1); not yet re-probed through
    # worker-start.
    orca_worker_start:
      agent: codex
      launch_model_selection: supported
      effective_identity_reported: true
      evidence: { launch_model_selection: live_probe, effective_identity_reported: live_probe }
      verified_at: "2026-09-24"
  claude_cli:
    registry_provider: claude
    command: claude
    provider_families: [claude]
    model_resolution: catalog_alias
    catalog_resolver: claude_models
    efforts: [low, medium, high, xhigh, max]
    resource_pools: { claude: claude }
    # NOT live-probed. launch_model_selection comes from local
    # `worker-start --help` ("--model supports Claude, Codex, and Cursor");
    # effective_identity_reported comes from the version-matched guide's
    # generic launch.requested/launch.effective rule. Promote either field to
    # live_probe only after an actual claude worker-start receipt.
    orca_worker_start:
      agent: claude
      launch_model_selection: supported
      effective_identity_reported: true
      evidence: { launch_model_selection: local_help, effective_identity_reported: version_matched_guide }
      verified_at: null
  antigravity:
    registry_provider: antigravity
    command: agy
    provider_families: [gemini, claude, gpt-oss]
    # Resolved against the LIVE `agy models` catalog at dispatch time (id +
    # display name per line). Effort is an id suffix where the catalog lists
    # variants (gemini-3.8-flash-high), otherwise the `--effort` session flag.
    model_resolution: live_catalog
    catalog_resolver: antigravity_models
    efforts: [low, medium, high]
    # Catalog entries WITHOUT effort variants (claude-sonnet-4-6,
    # claude-opus-4-6-thinking): effort is fixed by the runtime and `--effort`
    # must NOT be passed. Candidates on these models use reasoning
    # provider_default.
    unsuffixed_model_effort: none
    resource_pools: { gemini: antigravity.gemini, claude: antigravity.non_gemini, gpt-oss: antigravity.non_gemini }
    # Per-model pool overrides, keyed by the catalog base id (the id without
    # its -low|-medium|-high effort suffix). They win over resource_pools.
    # Gemini 4 Argon has its own weekly-only bucket on AI Pro (`agy /usage`
    # group "Gemini 4 Argon", bucket gemini-argon-wtu-weekly, 2026-10-19).
    model_resource_pools: { gemini-4-argon: antigravity.argon }
    # Orca supervised-worker support (orca 1.4.229, live-probed 2026-10-19):
    # `worker-start --agent antigravity --model gemini-3.8-flash-low` returned
    # launch.requested == launch.effective == {antigravity,
    # gemini-3.8-flash-low, effort null}; the worker sent worker_done
    # (succeeded) and self-reported "Gemini 3.8 Flash". Pass the effort-suffixed
    # catalog id as --model and omit --effort (`--effort requires --model`;
    # the catalog has no unsuffixed Gemini id to pair it with). Exact
    # Antigravity routing therefore uses WORKER_START like Codex/Claude.
    # History: on orca 1.4.209 (2026-09-24) --model was refused ("does not
    # support launch-time model selection") and exact routing needed
    # CUSTOM_DISPATCHED_WORKER. `--agent agy` is not a configured agent id.
    orca_worker_start:
      agent: antigravity
      launch_model_selection: supported
      effective_identity_reported: true
      evidence: { launch_model_selection: live_probe, effective_identity_reported: live_probe }
      verified_at: "2026-10-19"
    verified_at: "2026-09-18"
    note: >-
      2026-09-18 `agy models` (live): Gemini 3.8/3.7/3.6 Flash (low|medium|high
      ids), Gemini 3.1 Pro (high|low only), Claude Sonnet 4.6 (Thinking)
      `claude-sonnet-4-6`, Claude Opus 4.6 (Thinking) `claude-opus-4-6-thinking`,
      GPT-OSS 120B (Medium) `gpt-oss-120b-medium`. Not frozen here - resolve live.
      Live launch probe 2026-09-18, agy 1.2.6, claude-sonnet-4-6:
      `--effort low|medium|high` each REJECTED pre-launch ("--effort is not
      supported for model", 0 tokens, process exit 0 with JSON status ERROR);
      no `--effort` -> SUCCESS. VERIFIED for claude-sonnet-4-6 only;
      claude-opus-4-6-thinking has the same catalog shape but was not probed.
      A launch probe must read the JSON `status`, not the exit code.

