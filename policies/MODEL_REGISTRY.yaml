# Model Registry — the single owner of dynamic provider/model mapping.
#
# ADOPTERS READ THIS FIRST
# ------------------------
# The mapping shipped here reflects the AUTHORING HOST and the CLI state
# observed there at the recorded verification date. It is NOT a guarantee that
# these providers, models or plans are available to you.
#
# Every candidate is evidence_status: provisional. The Codex model IDs in
# particular rest only on local CLI state, because that CLI exposes no
# authoritative model-discovery command equivalent to `agy models`.
#
# Before your first dispatch, re-resolve every candidate against your OWN
# installed CLIs and subscription plans, and edit this file to match what you
# actually have. Routing on someone else's host state is a guess.
#
# Stable workflow rules live in the Markdown policies and do NOT change when a
# model changes. Only this file changes when mapping changes.
#
# The candidate order inside each slot is meaningful: it is the registry order
# that MODEL_ROUTING_POLICY.md preserves when resource states are YELLOW or
# UNKNOWN. Resource overlay may only reorder candidates that already meet the
# slot's minimum_tier / stage; it may never lower the capability floor.
#
# Evidence honesty rules (see MODEL_ROUTING_POLICY.md and references/):
#   status: stable        -> the provider/CLI/model mapping has been exercised
#                            locally and may take production work.
#   status: experimental  -> not yet exercised locally; excluded from routing
#                            unless the task context explicitly allows it.
#   evidence_status: provisional -> capability claim rests on external
#                            benchmarks or a small number of local cases. No
#                            candidate is 'verified' until the local smoke
#                            cases required by references/MODEL_EVIDENCE.md pass.
#
# --------------------------------------------------------------------------
# 0.5 (2026-09-02) THREE-STAGE CAPABILITY ROUTING + REASONING-EXACT DISPATCH
#
# `stages` is a backward-compatible layer ABOVE `capability_tier_order`. The
# four tiers still exist and every candidate/slot still carries a
# `capability_tier`; `stage` partitions those tiers so routing reasons about
# three bands instead of letting risk/importance masquerade as capability:
#
#   STAGE_1_DEFAULT  = { CHEAP, DEFAULT }  -> Luna / Gemini Flash low
#   STAGE_2_ADVANCED = { STRONG }          -> Terra / Sonnet 5 (Gemini high fallback)
#   STAGE_3_FLAGSHIP = { DEEP }            -> Sol / Opus 5, rare escalation only
#
# `stage` on a candidate MUST be the stage that contains its `capability_tier`.
# Legacy `minimum_tier`-only contracts map deterministically: CHEAP/DEFAULT ->
# Stage 1 admission, STRONG -> Stage 2, DEEP -> Stage 3. Stage admission logic
# (what makes a task Stage 2 or Stage 3) is owned by MODEL_ROUTING_POLICY.md.
#
# Default reasoning per candidate is `reasoning:`. It is the DEFAULT effort for
# that candidate; MODEL_ROUTING_POLICY.md defines when it may be raised on
# task evidence. Sol/Opus default to `medium` and are NEVER defaulted to max.
# Reasoning effort is part of the execution identity and MUST be dispatched
# explicitly for Codex; see references/OFFICIAL_COMMANDS.md.
#
# 0.4 forced Terra/Sol/Gemini to `stable` ahead of smoke cases by human
# decision. 0.5 keeps Terra and Sol as the human decided but RETURNS the
# antigravity/AUTO_GEMINI entries to `status: experimental`: PART G of the
# 0.5 instruction requires real local qualification, and the non-interactive
# `agy` path denies-closed on read tools so the reviewer/discovery/permission
# smoke cases could not be completed. See
# policies/registry-decisions/2026-09-02-three-stage-routing.md and
# references/MODEL_EVIDENCE.md.
# --------------------------------------------------------------------------

version: "0.5"
verified_at: "2026-09-02"

capability_tier_order: [CHEAP, DEFAULT, STRONG, DEEP]

# Capability stage: a backward-compatible band above capability_tier.
# Each tier belongs to exactly one stage (a partition), so a candidate's
# stage is fully derivable from its capability_tier and the explicit `stage`
# field on each candidate/slot is a redundant assertion the checker verifies.
stages:
  STAGE_1_DEFAULT:
    tiers: [CHEAP, DEFAULT]
    admission: default
    admission_note: >-
      The default for the majority of tasks. Used unless there is concrete
      evidence Stage 1 is insufficient. Risk, production-relatedness, security
      sensitivity and test volume do NOT by themselves raise the stage.
  STAGE_2_ADVANCED:
    tiers: [STRONG]
    admission: advanced_signal
    admission_note: >-
      Requires at least one advanced signal: high complexity, high ambiguity,
      structural change intensity, architecture reasoning, security/RLS
      semantic reasoning, high semantic coupling, adversarial verification, or
      a failed Stage 1 attempt. Risk alone is insufficient. This is the normal
      escalation tier.
  STAGE_3_FLAGSHIP:
    tiers: [DEEP]
    admission: exceptional_evidence
    admission_note: >-
      Rare. Requires exceptional evidence: Stage 2 failed to converge,
      unresolved disagreement between qualified reviewers, a major irreversible
      architectural decision with material ambiguity, adversarial security
      analysis, exceptional multi-stage agentic execution, an exceptional
      production incident, or explicit human authorization. Sol and Opus are
      flagship escalation resources, not routine workers.

# Dynamic display names must be resolved at use time, never frozen from one
# machine. See references/OFFICIAL_COMMANDS.md for the verified invocation.
resolvers:
  antigravity_models:
    command: "agy models"
    resolves: ["AUTO_GEMINI"]
    verified_at: "2026-09-02"
    note: >-
      AUTO_GEMINI is a placeholder. Resolve it against the live model list
      before dispatch. Do not hard-code a display name observed on one host.
      Verified 2026-09-02: the command returns a live list that also contains
      NON-Gemini families, so provider does not imply model_family. A
      resolution outside the candidate's declared model_family is
      CONFIG_INVALID and must not be dispatched - this is what keeps
      independent-review disjointness honest.
      Effort is encoded in the id: `reasoning: low` resolves to the
      `gemini-3.7-flash-low` family entry, `reasoning: high` to
      `gemini-3.7-flash-high` (observed 2026-09-02). `agy --effort low|medium|high`
      is the session-level equivalent. Resolve against the live list at
      dispatch time; this is a hint, not a frozen string.

capability_slots:

  ROUTER:
    role: ROUTER
    stage: STAGE_1_DEFAULT
    minimum_tier: DEFAULT
    max_repair_attempts: 2
    candidates:
      # Router is Stage 1 work. Do not routinely use Sol/Sonnet/Opus here.
      - provider: codex
        resource_state_key: codex
        model: gpt-5.6-luna
        model_family: gpt-5.6
        reasoning: max
        capability_tier: DEFAULT
        stage: STAGE_1_DEFAULT
        status: stable
        evidence_status: provisional
        evidence_scope: bounded_repo_implementation
        confidence: medium
        source: "local CLI global state, codex-cli 0.151.0; reasoning pinned max per 2026-09-02 human decision"
        verified_at: "2026-09-02"
        expires_at: "2026-12-01"
      - provider: antigravity
        resource_state_key: antigravity.gemini
        model: AUTO_GEMINI
        model_family: gemini
        reasoning: low
        capability_tier: DEFAULT
        stage: STAGE_1_DEFAULT
        status: experimental
        evidence_status: provisional
        evidence_scope: long_context_reasoning
        confidence: low
        source: "quota-relief alternative under Codex pressure; agy resolver verified 2026-09-02; reviewer/permission smoke cases incomplete (headless denies-closed) - see MODEL_EVIDENCE.md"
        verified_at: null
        expires_at: null

