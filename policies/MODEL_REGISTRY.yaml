# Model Registry — the single owner of dynamic provider/model mapping.
#
# Stable workflow rules live in the Markdown policies and do NOT change when a
# model changes. Only this file changes when mapping changes.
#
# The candidate order inside each slot is meaningful: it is the registry order
# that MODEL_ROUTING_POLICY.md preserves when resource states are YELLOW or
# UNKNOWN. Resource overlay may only reorder candidates that already meet the
# slot's minimum_tier; it may never lower the capability floor.
#
# Evidence honesty rules (see MODEL_ROUTING_POLICY.md and references/):
#   status: stable        -> the provider/CLI/model mapping has been exercised
#                            locally and may take production work.
#   status: experimental  -> not yet exercised locally; excluded from routing
#                            unless the task context explicitly allows it.
#   evidence_status: provisional -> capability claim rests on external
#                            benchmarks or a small number of local cases. No
#                            candidate is 'verified' until the local smoke
#                            cases required by references/MODEL_EVIDENCE.md pass.

version: "0.3"
verified_at: "2026-09-01"

capability_tier_order: [CHEAP, DEFAULT, STRONG, DEEP]

# Dynamic display names must be resolved at use time, never frozen from one
# machine. See references/OFFICIAL_COMMANDS.md for the verified invocation.
resolvers:
  antigravity_models:
    command: "agy models"
    resolves: ["AUTO_GEMINI"]
    note: >-
      AUTO_GEMINI is a placeholder. Resolve it against the live model list
      before dispatch. Do not hard-code a display name observed on one host.

capability_slots:

  ROUTER:
    role: ROUTER
    minimum_tier: DEFAULT
    max_repair_attempts: 2
    candidates:
      - provider: codex
        resource_state_key: codex
        model: gpt-5.6-luna
        model_family: gpt-5.6
        reasoning: low
        capability_tier: DEFAULT
        status: stable
        evidence_status: provisional
        evidence_scope: bounded_repo_implementation
        confidence: medium
        source: "local CLI global state, codex-cli 0.151.0"
        verified_at: "2026-09-01"
        expires_at: "2026-12-01"
      - provider: claude
        resource_state_key: claude
        model: sonnet
        model_family: claude-sonnet
        reasoning: provider_default
        capability_tier: DEEP
        status: stable
